name: CI

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - dev
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Verify release-critical files
        run: |
          test -f requirements.txt
          test -f Dockerfile
          test -f .env.example
          test -f workflows/google_slides_monthly_report.md
          test -f tools/run_google_slides_report.py
          test -f tools/run_control_sheet_reports.py
          test -f tools/report_ops_service.py

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Compile scripts
        run: python -m py_compile tools/*.py tools/benchmarks/*.py

      - name: Verify CLI help
        run: |
          python tools/run_google_slides_report.py --help
          python tools/run_control_sheet_reports.py --help
          python tools/run_country_benchmarks.py --help
          bash -n tools/setup_country_benchmark_schedule.sh

  web:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint portal
        run: npm run lint

      - name: Test portal
        run: npm run test:web

      - name: Build portal
        run: npx next build

      - name: Verify private files are excluded
        run: python tools/check_benchmark_bundle.py

  docker-build:
    runs-on: ubuntu-latest
    needs: [test, web]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t marketing-report-automation:ci .
